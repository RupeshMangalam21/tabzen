<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabZen Search</title>
  <link rel="stylesheet" href="styles/search.css">
</head>
<body>
  <div id="app">
    <div class="search-container">
      <div class="search-header">
        <div class="logo">
          <img src="icons/icon48.png" alt="TabZen Logo">
          <h1>TabZen Search</h1>
        </div>
        <button id="themeToggleBtn" title="Toggle Dark Mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
      
      <div class="search-input-container">
        <input type="text" id="searchInput" placeholder="Search tabs by title or URL..." autofocus>
        <div class="search-shortcuts">
          <span>Press <kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
          <span>Press <kbd>Enter</kbd> to activate</span>
          <span>Press <kbd>Esc</kbd> to close</span>
        </div>
      </div>
      
      <div id="searchResults" class="search-results">
        <!-- Results will be populated here -->
        <div class="empty-state">Start typing to search tabs</div>
      </div>
    </div>
  </div>
  
  <script src="search.js" type="module"></script>
</body>
</html>
